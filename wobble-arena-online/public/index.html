<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Quick Six</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
html,body{margin:0;height:100%;background:#0b1630;overflow:hidden;font-family:"Trebuchet MS","Segoe UI",Arial,sans-serif;color:#1d2a55;user-select:none}
#stage{position:absolute;left:50%;top:50%;width:1280px;height:720px;transform-origin:center center;overflow:hidden;border-radius:14px}
#cv{position:absolute;left:0;top:0;width:1280px;height:720px}
#ui{position:absolute;left:0;top:0;width:1280px;height:720px}
#status{position:absolute;right:14px;top:10px;background:rgba(20,30,70,.72);color:#fff;padding:6px 14px;border-radius:20px;font-size:16px;font-weight:700;pointer-events:none}
#toast{position:absolute;left:50%;bottom:24px;transform:translateX(-50%);background:#1d2a55;color:#fff;padding:10px 22px;border-radius:14px;font-size:18px;font-weight:700;opacity:0;transition:opacity .3s;pointer-events:none;max-width:900px;text-align:center}
.screen{position:absolute;left:0;top:0;width:1280px;height:720px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;box-sizing:border-box;padding:30px}
.screen.left{align-items:flex-start;padding-left:60px;width:760px}
.logo{font-size:124px;font-weight:900;line-height:.9;text-align:center;letter-spacing:4px;color:#fff;text-shadow:0 3px 0 #9fb6dd,0 6px 0 #7f9ad0,0 9px 0 #6a86c2,0 16px 24px rgba(20,40,110,.45)}
.logo span{color:#2aa7ff;text-shadow:0 3px 0 #1c86d6,0 6px 0 #166fb8,0 9px 0 #115c9c,0 16px 24px rgba(20,40,110,.45)}
h2{font-size:44px;margin:0;color:#1d2a55;text-shadow:0 2px 0 #fff}
p{margin:0}
.sub{font-size:20px;max-width:940px;text-align:center;line-height:1.35;font-weight:700}
.warn{font-size:18px;background:#d8553f;color:#fff;padding:8px 16px;border-radius:12px;max-width:820px;text-align:center}
.help{font-size:16px;line-height:1.45;max-width:660px;font-weight:600}
.btn{background:linear-gradient(#ffffff,#e4ebf8);color:#1d2a55;border:3px solid #b7c6e4;border-radius:22px;padding:11px 26px;font:800 24px "Trebuchet MS","Segoe UI",Arial,sans-serif;box-shadow:0 6px 0 #9fb1d6,0 12px 18px rgba(30,50,120,.25);cursor:pointer;transition:transform .08s}
.btn.big{font-size:36px;padding:16px 60px}
.btn.sm{font-size:18px;padding:7px 16px;border-radius:14px}
.btn.gold{background:linear-gradient(#ffe680,#ffc21f);border-color:#d99a00;box-shadow:0 6px 0 #c48a00,0 12px 18px rgba(30,50,120,.25)}
.btn.focus{border-color:#2aa7ff;box-shadow:0 6px 0 #1c86d6,0 0 0 6px rgba(42,167,255,.55),0 12px 18px rgba(30,50,120,.25);transform:scale(1.05)}
.grid{display:flex;flex-wrap:wrap;gap:18px;justify-content:center;max-width:1160px}
.card{display:flex;flex-direction:column;align-items:center;width:150px;padding:10px 6px;font-size:20px}
.card img{width:110px;height:150px}
.plus{font-size:90px;line-height:150px;height:150px;color:#8b9cc5}
.game{width:262px;display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px}
.game .ico{font-size:52px;line-height:1.1}
.game b{font-size:23px}
.game small{font-size:14px;color:#6a7aa6;font-weight:700}
.rank{font-size:17px;font-weight:900}
.bar{width:200px;height:10px;background:#cfd9ee;border-radius:6px;overflow:hidden}
.bar i{display:block;height:100%}
.rowb{display:flex;gap:14px;align-items:center;justify-content:center;flex-wrap:wrap}
.hubtop{display:flex;align-items:center;gap:14px}
.hubtop img{width:66px;height:90px}
.panel{background:rgba(255,255,255,.8);border:3px solid #fff;border-radius:20px;padding:14px 24px;font-size:20px;line-height:1.4;max-width:920px;text-align:center;font-weight:700;box-shadow:0 10px 24px rgba(30,50,120,.18)}
.panel .ctl{color:#1c7fd0;margin-top:8px}
.opps{display:flex;gap:26px;justify-content:center}
.opps div{display:flex;flex-direction:column;align-items:center;font-size:17px;font-weight:800}
.opps img{width:74px;height:100px}
.lv{background:#1d2a55;color:#fff;border-radius:10px;padding:1px 9px;font-size:15px}
.crow{display:flex;align-items:center;gap:12px;font-size:22px;font-weight:800}
.crow span{width:150px;text-align:right}
.crow em{width:130px;text-align:center;font-style:normal}
.crow i{display:inline-block;width:60px;height:30px;border-radius:8px;border:3px solid #fff;box-shadow:0 0 0 2px #b7c6e4;vertical-align:middle}
.creator{display:flex;gap:50px;align-items:center}
.creator img{width:240px;height:330px;background:rgba(255,255,255,.6);border-radius:24px}
input.name{font:800 26px "Trebuchet MS",sans-serif;padding:8px 14px;border-radius:12px;border:3px solid #b7c6e4;width:230px;text-align:center;color:#1d2a55}
.delta{font-size:40px;font-weight:900}
.up{color:#149a4a}.down{color:#d23b3b}
.banner{font-size:30px;font-weight:900;color:#1d2a55;background:linear-gradient(#ffe680,#ffc21f);padding:8px 26px;border-radius:16px;box-shadow:0 6px 0 #c48a00}
.logo.sm{font-size:84px}
.col{display:flex;flex-direction:column;gap:12px;align-items:center}
#look{width:150px;height:205px}
input.code{width:130px;text-transform:uppercase;letter-spacing:6px}
.small{font-size:16px}
.codebig{font-size:58px;line-height:1;font-weight:900;letter-spacing:12px;color:#1c7fd0;text-shadow:0 3px 0 #fff;user-select:text}
.codebig small{font-size:20px;letter-spacing:0;color:#1d2a55;text-shadow:none;vertical-align:middle}
.pcard{display:flex;flex-direction:column;align-items:center;width:118px;padding:5px;background:rgba(255,255,255,.8);border:3px solid #fff;border-radius:18px;font-size:17px}
.pcard.me{border-color:#2aa7ff}
.pcard img{width:48px;height:66px}
.pcard span{font-size:13px;font-weight:800;color:#c8940a}
.pcard small{font-size:12px;font-weight:700;color:#6a7aa6}
.grid.tight{gap:10px;max-width:1200px}
.btn.gbtn{font-size:17px;padding:8px 12px;border-radius:14px;width:158px;display:flex;flex-direction:column;align-items:center;gap:2px}
.btn.gbtn span{font-size:26px;line-height:1}
.btn.cardb{width:250px;display:flex;flex-direction:column;align-items:center;gap:4px;padding:14px}
.btn.cardb .ico{font-size:50px;line-height:1.1;font-weight:900;color:#1c7fd0}
.btn.cardb small{font-size:15px;color:#6a7aa6;font-weight:700;line-height:1.25}
.btn.cardb.sel{border-color:#d99a00;background:linear-gradient(#fff6c8,#ffe27a);transform:scale(1.06)}
.btn[disabled]{opacity:.45;cursor:default}
.screen.bottom{justify-content:flex-end;padding-bottom:16px;pointer-events:none}
.screen.bottom .btn{pointer-events:auto;font-size:26px;padding:10px 40px;position:absolute;right:30px;top:24px}
.rlist{display:flex;flex-direction:column;gap:8px}
.rrow{display:flex;align-items:center;gap:14px;background:rgba(255,255,255,.88);border-radius:16px;padding:4px 22px;font-size:24px;font-weight:800;min-width:540px}
.rrow.me{outline:4px solid #2aa7ff}
.rrow .pos{width:60px;font-size:30px;text-align:center}
.rrow img{width:44px;height:60px}
.rrow em{margin-left:auto;font-style:normal;color:#1c7fd0}
.rrow i{font-style:normal;font-size:18px;margin-left:14px}
.screen.bottom.wait .rowb{pointer-events:auto;margin-bottom:6px}
.screen.bottom.wait .btn{position:static;font-size:17px;padding:7px 14px}
.btn.gbtn small{font-size:12px;color:#1c7fd0;font-weight:800}
</style>
</head>
<body>
<div id="stage">
  <canvas id="cv" width="1280" height="720"></canvas>
  <div id="ui"></div>
</div>
<script>
'use strict';
const cv=document.getElementById('cv'), ctx=cv.getContext('2d');
const ui=document.getElementById('ui'), stage=document.getElementById('stage');
const W=1280,H=720,TAU=Math.PI*2;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const rand=(a,b)=>a+Math.random()*(b-a);
const ri=(a,b)=>Math.floor(rand(a,b+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const ease=t=>{t=clamp(t,0,1);return 1-Math.pow(1-t,3);};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function fit(){const s=Math.min(window.innerWidth/W,window.innerHeight/H);stage.style.transform='translate(-50%,-50%) scale('+s+')';}
window.addEventListener('resize',fit);fit();
let sndOn=true;try{sndOn=localStorage.getItem('wobbleOnline.sound')!=='off';}catch(e){}
const state={current:-1,settings:{sound:sndOn}};
const Store={save(){try{localStorage.setItem('wobbleOnline.sound',state.settings.sound?'on':'off');}catch(e){}}};

/* ---------------- sound: everything is synthesised, no files ---------------- */
const mf=m=>440*Math.pow(2,(m-69)/12);
const Snd={
  ac:null,
  init(){
    if(this.ac){if(this.ac.state==='suspended')this.ac.resume();return;}
    const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;
    const ac=this.ac=new AC();
    this.out=ac.createDynamicsCompressor();this.master=ac.createGain();this.master.gain.value=state.settings.sound?0.9:0;
    this.master.connect(this.out);this.out.connect(ac.destination);
    this.mus=ac.createGain();this.mus.gain.value=0.55;this.mus.connect(this.master);
    this.fx=ac.createGain();this.fx.gain.value=1;this.fx.connect(this.master);
    const b=ac.createBuffer(1,ac.sampleRate,ac.sampleRate),d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;this.nb=b;
    ac.onstatechange=()=>{if(ac.state==='running')Music.kick();};
    if(ac.state==='running')Music.kick();else ac.resume();
  },
  ok(){return !!this.ac&&this.ac.state==='running';},
  setOn(on){state.settings.sound=on;Store.save();if(this.master)this.master.gain.value=on?0.9:0;},
  tone(f,d,o){
    if(!this.ok())return;o=o||{};const ac=this.ac,t=o.t!=null?o.t:ac.currentTime+(o.at||0),os=ac.createOscillator(),g=ac.createGain();
    os.type=o.type||'sine';os.frequency.setValueAtTime(f,t);if(o.to)os.frequency.exponentialRampToValueAtTime(o.to,t+d);
    const v=o.vol==null?0.2:o.vol;g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(v,t+0.008);g.gain.exponentialRampToValueAtTime(0.0001,t+d);
    os.connect(g);g.connect(o.dest||this.fx);os.start(t);os.stop(t+d+0.03);
  },
  nz(d,o){
    if(!this.ok())return;o=o||{};const ac=this.ac,t=o.t!=null?o.t:ac.currentTime+(o.at||0),s=ac.createBufferSource(),fl=ac.createBiquadFilter(),g=ac.createGain();
    s.buffer=this.nb;s.loop=true;fl.type=o.ft||'lowpass';fl.frequency.setValueAtTime(o.f||1000,t);if(o.to)fl.frequency.exponentialRampToValueAtTime(o.to,t+d);fl.Q.value=o.q||0.8;
    const v=o.vol==null?0.2:o.vol;g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(v,t+(o.atk||0.006));g.gain.exponentialRampToValueAtTime(0.0001,t+d);
    s.connect(fl);fl.connect(g);g.connect(o.dest||this.fx);s.start(t,Math.random()*0.5);s.stop(t+d+0.03);
  },
  arp(notes,step,o){notes.forEach((m,i)=>this.tone(mf(m),(o&&o.d)||0.22,{type:(o&&o.type)||'square',vol:(o&&o.vol)||0.13,at:i*step}));},
  sfx(n){
    const T=this;
    switch(n){
      case 'move':T.tone(700,0.05,{type:'triangle',vol:0.12});break;
      case 'ok':T.tone(880,0.07,{type:'triangle',vol:0.18});T.tone(1320,0.12,{type:'triangle',vol:0.18,at:0.06});break;
      case 'back':T.tone(520,0.12,{type:'triangle',vol:0.15,to:330});break;
      case 'beep':T.tone(523,0.16,{type:'square',vol:0.14});break;
      case 'go':T.tone(1046,0.45,{type:'square',vol:0.16});T.nz(0.5,{f:3000,ft:'bandpass',vol:0.12});break;
      case 'tap':T.nz(0.05,{f:900,vol:0.22});T.tone(160,0.05,{vol:0.2,to:90});break;
      case 'pump':T.tone(170,0.1,{type:'sawtooth',vol:0.12,to:480});T.nz(0.08,{f:2500,ft:'highpass',vol:0.08});break;
      case 'gem':T.tone(1320,0.08,{type:'triangle',vol:0.2});T.tone(1976,0.2,{type:'triangle',vol:0.2,at:0.07});break;
      case 'hit':T.nz(0.35,{f:400,vol:0.6});T.tone(140,0.3,{type:'sawtooth',vol:0.3,to:45});break;
      case 'whoosh':T.nz(0.45,{f:500,to:3200,ft:'bandpass',q:1.5,vol:0.3,atk:0.15});break;
      case 'wind':T.nz(1.6,{f:400,to:1400,ft:'bandpass',q:2,vol:0.35,atk:0.5});break;
      case 'warn':T.tone(880,0.1,{type:'square',vol:0.14});T.tone(880,0.1,{type:'square',vol:0.14,at:0.16});break;
      case 'fall':T.tone(900,1.0,{type:'sine',vol:0.25,to:110});T.nz(0.3,{f:300,vol:0.5,at:1.0});break;
      case 'slam':T.nz(0.25,{f:220,vol:0.7});T.tone(95,0.3,{vol:0.5,to:40});break;
      case 'charge':T.tone(200,0.4,{type:'sawtooth',vol:0.13,to:700});break;
      case 'dodge':T.nz(0.3,{f:600,to:3500,ft:'bandpass',q:1.5,vol:0.3});T.tone(988,0.08,{type:'triangle',vol:0.2,at:0.1});T.tone(1480,0.15,{type:'triangle',vol:0.2,at:0.17});break;
      case 'bang':T.nz(0.3,{f:1600,vol:0.7});T.tone(220,0.22,{type:'square',vol:0.25,to:55});break;
      case 'bell':T.tone(1568,0.5,{type:'sine',vol:0.3});T.tone(3136,0.3,{type:'sine',vol:0.12});break;
      case 'fake':T.tone(1100,0.12,{type:'triangle',vol:0.2});break;
      case 'buzz':T.tone(110,0.5,{type:'sawtooth',vol:0.25});T.tone(117,0.5,{type:'sawtooth',vol:0.2});break;
      case 'launch':T.nz(4.5,{f:200,to:1800,vol:0.6,atk:0.4});T.tone(60,4,{type:'sawtooth',vol:0.15,to:160});break;
      case 'cheer':T.nz(2.2,{f:1300,ft:'bandpass',q:0.6,vol:0.3,atk:0.4});T.nz(2.2,{f:2600,ft:'bandpass',q:0.9,vol:0.14,atk:0.5});break;
      case 'kick':T.tone(140,0.14,{vol:0.5,to:60});T.nz(0.08,{f:900,vol:0.35});break;
      case 'crack':T.nz(0.07,{f:2600,ft:'highpass',vol:0.5});T.tone(900,0.09,{type:'square',vol:0.25,to:300});break;
      case 'win':T.arp([72,76,79,84,88],0.1);T.tone(mf(84),0.9,{type:'triangle',vol:0.2,at:0.55});T.tone(mf(88),0.9,{type:'triangle',vol:0.16,at:0.55});T.tone(mf(91),0.9,{type:'triangle',vol:0.16,at:0.55});break;
      case 'lose':T.arp([67,63,60,55],0.2,{type:'triangle',d:0.4,vol:0.2});break;
      case 'mid':T.arp([72,76,79],0.12,{type:'triangle',vol:0.18});break;
      case 'rank':T.arp([72,72,72,76,79,84],0.12,{d:0.3});T.sfx('cheer');break;
      case 'champ':T.arp([72,76,79,84,79,84,88,91,96],0.11,{d:0.35});T.sfx('cheer');break;
    }
  }
};
const SONGS={
  menu:{bpm:116,lt:'triangle',lv:0.2,
    lead:[72,0,76,79,0,76,72,0, 69,0,72,76,0,72,69,0, 77,0,76,74,72,0,69,0, 74,0,71,67,71,74,0,0,
          72,0,76,79,0,84,79,0, 83,0,79,76,0,79,76,0, 77,76,74,72,0,74,76,0, 79,0,74,71,79,0,0,0],
    roots:[48,45,41,43,48,40,41,43],minor:[0,1,0,0,0,1,0,0],kick:[1,0,0,0,1,0,0,0]},
  game:{bpm:158,lt:'square',lv:0.085,
    lead:[81,81,0,84,83,0,81,0, 77,77,0,81,79,0,77,0, 76,79,84,0,83,79,76,0, 74,79,83,0,86,0,83,0,
          81,84,88,0,86,84,81,0, 77,81,84,0,86,84,81,0, 79,83,86,0,88,86,83,0, 80,83,88,0,92,0,88,0],
    roots:[45,41,48,43,45,41,43,40],minor:[1,0,0,0,1,0,0,0],kick:[1,0,0,1,1,0,1,0]}
};
const Music={
  want:null,cur:null,step:0,next:0,timer:null,
  play(n,delay){
    this.want=n;if(!Snd.ok()||this.cur===n)return;
    this.cur=n;this.step=0;this.next=Snd.ac.currentTime+(delay||0.06);
    if(!this.timer)this.timer=setInterval(()=>this.tick(),30);
  },
  kick(){const n=this.want;this.cur=null;if(n)this.play(n);},
  stop(){this.want=null;this.cur=null;},
  tick(){
    if(!this.cur||!Snd.ok())return;const S=SONGS[this.cur],sd=30/S.bpm,ac=Snd.ac;
    if(this.next<ac.currentTime-0.4)this.next=ac.currentTime+0.05;
    while(this.next<ac.currentTime+0.16){this.sched(S,this.step,this.next,sd);this.next+=sd;this.step=(this.step+1)%64;}
  },
  sched(S,i,t,sd){
    const bar=i>>3,b=i&7,root=S.roots[bar],m=S.lead[i],d=Snd.mus;
    if(m)Snd.tone(mf(m),sd*1.7,{type:S.lt,vol:S.lv,t:t,dest:d});
    if(b===0||b===3||b===4||b===6)Snd.tone(mf(root+(b===3?7:b===6?12:0)),sd*1.3,{type:'triangle',vol:0.26,t:t,dest:d});
    if(b===2||b===6){const th=S.minor[bar]?3:4;for(const k of[12,12+th,19])Snd.tone(mf(root+k),sd*0.9,{type:'sine',vol:0.07,t:t,dest:d});}
    if(S.kick[b])Snd.tone(150,0.13,{vol:0.4,to:45,t:t,dest:d});
    if(b===2||b===6)Snd.nz(0.1,{f:1800,ft:'highpass',vol:0.12,t:t,dest:d});
    Snd.nz(0.03,{f:7000,ft:'highpass',vol:b%2?0.03:0.05,t:t,dest:d});
  }
};
window.addEventListener('pointerdown',()=>Snd.init());
window.addEventListener('keydown',()=>Snd.init());

/* ---------------- drawing helpers ---------------- */
function rr(g,x,y,w,h,r){r=Math.max(0,Math.min(r,w/2,h/2));g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath();}
function txt(g,s,x,y,size,col,align,stroke){
  g.font='900 '+(size||40)+'px "Trebuchet MS","Segoe UI",Arial,sans-serif';g.textAlign=align||'center';g.textBaseline='middle';
  if(stroke!==false){g.lineWidth=Math.max(3,(size||40)/6);g.strokeStyle='rgba(10,20,50,.7)';g.lineJoin='round';g.strokeText(s,x,y);}
  g.fillStyle=col||'#fff';g.fillText(s,x,y);
}
function countdown(g,t){
  if(t<0){const n=Math.ceil(-t),f=1-((-t)%1);txt(g,String(n),W/2,H/2-40,170+f*40,'#fff');}
  else if(t<0.8)txt(g,'GO!',W/2,H/2-40,200,'#ffd23f');
}
function hudBox(g,x,y,w,h){g.fillStyle='rgba(15,25,60,.62)';rr(g,x,y,w,h,16);g.fill();g.strokeStyle='rgba(255,255,255,.35)';g.lineWidth=2;g.stroke();}
function hx(c){c=c.replace('#','');if(c.length===3)c=c.split('').map(x=>x+x).join('');return[parseInt(c.slice(0,2),16),parseInt(c.slice(2,4),16),parseInt(c.slice(4,6),16)];}
function lite(c,t){return 'rgb('+hx(c).map(v=>Math.round(v+(255-v)*t)).join(',')+')';}
function dark(c,t){return 'rgb('+hx(c).map(v=>Math.round(v*(1-t))).join(',')+')';}
function ball(g,x,y,r,col){
  const gr=g.createRadialGradient(x-r*0.35,y-r*0.42,r*0.08,x,y,r*1.05);
  gr.addColorStop(0,lite(col,0.5));gr.addColorStop(0.5,col);gr.addColorStop(1,dark(col,0.38));
  g.fillStyle=gr;g.beginPath();g.arc(x,y,r,0,TAU);g.fill();
}
function vgrad(g,y0,y1,stops){const gr=g.createLinearGradient(0,y0,0,y1);stops.forEach((c,i)=>gr.addColorStop(i/(stops.length-1),c));return gr;}

function connect(first){
  if(ws)return;
  let sock;try{sock=new WebSocket((location.protocol==='https:'?'wss':'ws')+'://'+location.host+'/ws');}catch(e){showHome('Could not reach the game server.');return;}
  ws=sock;
  first.tok=card.tok;
  sock.onopen=()=>sock.send(JSON.stringify(first));
  sock.onmessage=e=>{let m;try{m=JSON.parse(e.data);}catch(err){return;}onMsg(m);};
  sock.onclose=()=>{if(ws!==sock)return;ws=null;const had=room;room=null;G=null;showHome(had?'Connection to the server was lost.':'Could not reach the game server.');};

function onMsg(m){
  if(m.t==='ping'){send({t:'pong',id:m.id});return;}
  if(m.t==='room'){room=m;myId=m.you;roomAt=performance.now();if(view==='home'||view==='lobby'||view==='wait')showLobby();return;}
  if(m.t==='card'){card={tok:m.tok,r:m.r,g:m.g,w:m.w};try{localStorage.setItem(CARD_KEY,JSON.stringify(card));}catch(e){}return;}
  if(m.t==='emote'){EM[m.id]={e:m.e,t:0};if(view==='wait')Snd.sfx(m.e===6?'back':'move');return;}
  if(m.t==='err'){const s=ws;ws=null;if(s)s.close();room=null;showHome(m.msg);return;}
  if(m.t==='left'){const s=ws;ws=null;if(s)s.close();room=null;G=null;showHome();return;}
  if(m.t==='g'){
    if(!room)return;
    if(!CLIENTS[m.g])return;
    if(!G||G.name!==m.g||m.ev==='intro'){G=new CLIENTS[m.g]();G.name=m.g;view='game';ui.innerHTML='';Music.play('game');}
    G.on(m);return;
  }
  if(m.t==='over'){showOver(m);return;}
  if(m.t==='party'){if(room)onParty(m);return;}
}

const SPOT=[[640,256],[930,420],[640,590],[350,420]],FOOD=['#f7c6d0','#f4a261','#9be36b','#ffe08a'];
class CSwat{

    SPOT.forEach((p,i)=>{g.fillStyle='rgba(0,0,0,.18)';g.beginPath();g.arc(p[0]+5,p[1]+9,88,0,TAU);g.fill();ball(g,p[0],p[1],86,'#ffffff');g.strokeStyle='#c9d4ea';g.lineWidth=5;g.beginPath();g.arc(p[0],p[1],67,0,TAU);g.stroke();ball(g,p[0],p[1],44,FOOD[i]);});
    txt(g,'▲',640,420-62,30,'#8b9cc5',null,false);txt(g,'▶',704,420,30,'#8b9cc5',null,false);txt(g,'▼',640,482,30,'#8b9cc5',null,false);txt(g,'◀',576,420,30,'#8b9cc5',null,false);

const EMOTES=[null,['6 7','6 7!'],['Dab','DAB'],['Wave','hi!'],['Dance','\u266B \u266A'],['Jump','YEAH!'],['Bruh','bruh...']];
function emoteOpts(e,t){
  const s=Math.sin(t*11);
  if(e===1)return{armL:1.7+s*0.55,armR:1.7-s*0.55,bob:-Math.abs(s)*4,face:'happy'};
  if(e===2)return{tilt:-0.3,armL:2.45,armR:2.95,bob:6,face:'effort'};
  if(e===3)return{armR:2.5+Math.sin(t*16)*0.35,face:'happy'};

  if(e===5)return{bob:-Math.abs(Math.sin(t*9))*36,armL:2.8,armR:2.8,face:'happy'};
  return{armR:2.95,tilt:0.06,face:'sad'};
}

const KEYS={' ':'fire',Enter:'fire',ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right',z:'z',Z:'z',x:'x',X:'x'};

  for(let i=0;i<8;i++){const x=(((i*190+t*(10+i*2))%1600)+1600)%1600-160;cloud(g,x,70+((i*97)%240),0.8+(i%3)*0.35);}
  g.fillStyle=vgrad(g,560,H,['#8fe08a','#4fb45f']);g.beginPath();g.moveTo(0,H);g.lineTo(0,620);g.quadraticCurveTo(320,540,640,610);g.quadraticCurveTo(960,670,W,590);g.lineTo(W,H);g.closePath();g.fill();
  g.fillStyle='rgba(255,255,255,.35)';g.fillRect(0,0,W,H);
}
let last=performance.now(),menuT=0;
function frame(nowT){
  const dt=Math.min(0.05,Math.max(0,(nowT-last)/1000));last=nowT;
  if(view==='game'&&G)G.draw(ctx,dt);else{menuT+=dt;drawMenuBg(ctx,menuT);if(view==='party')drawParty(ctx,dt);else if(view==='wait')drawWait(ctx,dt);}
  requestAnimationFrame(frame);
}
showHome();
requestAnimationFrame(frame);
</script>
